[project]
name = "e2e-test-svc"
version = "0.1.0"
description = "Self-hosted Playwright workflow testing with immutable snapshots and traceable evidence"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.135,<1", "uvicorn[standard]>=0.41,<1",
  "fastapi-users[sqlalchemy]>=15,<16", "sqlalchemy[asyncio]>=2.0.48,<2.1",
  "asyncpg>=0.31,<1", "alembic>=1.18,<2", "pydantic-settings>=2.13,<3",
  "cryptography>=46,<48", "httpx>=0.28,<1", "websockets>=16,<17"
]
[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "asgi-lifespan>=2.1,<3",
    "ruff>=0.15,<1",
    "jsonschema>=4,<5",
]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
target-version = "py312"
line-length = 120
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
