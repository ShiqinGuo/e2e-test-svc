name: e2e-test-platform
services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: e2e
      POSTGRES_DB: e2e
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e2e -d e2e"]
      interval: 3s
      timeout: 3s
      retries: 20
secrets:
  postgres_password:
    file: ./data/postgres.password
volumes:
  postgres_data:
