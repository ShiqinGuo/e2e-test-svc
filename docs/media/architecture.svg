<g font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" fill="#30364c">
<text x="40" y="51" font-size="28" font-weight="700">Flowtest / 从源码到证据</text>
<text x="40" y="81" font-size="16" fill="#72798d">控制状态、浏览器执行和证据存储，各有明确职责。</text>
<rect x="40" y="136" width="300" height="120" rx="15" fill="#dddfea" />
<rect x="40" y="130" width="300" height="120" rx="15" fill="#ffffff" stroke="#d7daea" />
