<text x="430" y="194" font-size="15" fill="#72798d" font-weight="400">认证、项目权限与任务编排</text>
<text x="430" y="217" font-size="15" fill="#72798d" font-weight="400">版本 + 环境快照</text>
<rect x="780" y="136" width="300" height="120" rx="15" fill="#dddfea" />
<rect x="780" y="130" width="300" height="120" rx="15" fill="#ffffff" stroke="#d7daea" />
