<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="800" viewBox="0 0 1120 800" role="img" aria-labelledby="title desc">
<title id="title">Flowtest 技术架构</title>
<desc id="desc">React workbench connects to FastAPI with cookie-authorized HTTP and WebSocket. FastAPI stores platform state in PostgreSQL and private artifacts on disk. A trusted Node controller launches isolated Playwright recorder and runner containers, which access configured target websites and APIs.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#777cb3" /></marker></defs>
