<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="800" viewBox="0 0 1120 800" role="img" aria-labelledby="title desc">
<title id="title">Flowtest technical architecture</title>
<desc id="desc">React workbench connects to FastAPI with cookie-authorized HTTP and WebSocket. FastAPI stores platform state in PostgreSQL and private artifacts on disk. A trusted Node controller launches isolated Playwright recorder and runner containers, which access configured target websites and APIs.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#777cb3"/></marker></defs>
<rect width="1120" height="800" rx="20" fill="#f6f6fb"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#30364c">
<text x="40" y="51" font-size="28" font-weight="700">Flowtest / from source to evidence</text>
<text x="40" y="81" font-size="16" fill="#72798d">Control state, browser execution and evidence have separate owners.</text>
<rect x="40" y="136" width="300" height="120" rx="15" fill="#dddfea"/>
<rect x="40" y="130" width="300" height="120" rx="15" fill="#ffffff" stroke="#d7daea"/>
<text x="60" y="164" font-size="20" fill="#30364c" font-weight="700">Web workbench</text>
<text x="60" y="194" font-size="15" fill="#72798d" font-weight="400">React / Vite / CodeMirror</text>
<text x="60" y="217" font-size="15" fill="#72798d" font-weight="400">Source, versions and evidence</text>
<rect x="410" y="136" width="300" height="120" rx="15" fill="#dddfea"/>
<rect x="410" y="130" width="300" height="120" rx="15" fill="#eaeaf8" stroke="#d7daea"/>
<text x="430" y="164" font-size="20" fill="#30364c" font-weight="700">FastAPI control service</text>
<text x="430" y="194" font-size="15" fill="#72798d" font-weight="400">Auth, project access, jobs</text>
<text x="430" y="217" font-size="15" fill="#72798d" font-weight="400">Versions + environment snapshots</text>
<rect x="780" y="136" width="300" height="120" rx="15" fill="#dddfea"/>
<rect x="780" y="130" width="300" height="120" rx="15" fill="#ffffff" stroke="#d7daea"/>
<text x="800" y="164" font-size="20" fill="#30364c" font-weight="700">PostgreSQL</text>
<text x="800" y="194" font-size="15" fill="#72798d" font-weight="400">Platform state + sessions</text>
<text x="800" y="217" font-size="15" fill="#72798d" font-weight="400">Encrypted environment secrets</text>
<path d="M340 190 H410" fill="none" stroke="#777cb3" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="341" y="173" font-size="12" fill="#6569a5" font-weight="400">HTTP / WS</text>
<path d="M710 190 H780" fill="none" stroke="#777cb3" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="719" y="173" font-size="12" fill="#6569a5" font-weight="400">asyncpg</text>
<rect x="40" y="346" width="300" height="120" rx="15" fill="#dddfea"/>
<rect x="40" y="340" width="300" height="120" rx="15" fill="#ffffff" stroke="#d7daea"/>
<text x="60" y="374" font-size="20" fill="#30364c" font-weight="700">Private artifacts</text>
<text x="60" y="404" font-size="15" fill="#72798d" font-weight="400">Host data directory</text>
<text x="60" y="427" font-size="15" fill="#72798d" font-weight="400">Trace / screenshots / logs</text>
<rect x="410" y="346" width="300" height="120" rx="15" fill="#dddfea"/>
<rect x="410" y="340" width="300" height="120" rx="15" fill="#eaeaf8" stroke="#d7daea"/>
<text x="430" y="374" font-size="20" fill="#30364c" font-weight="700">Trusted Node controller</text>
<text x="430" y="404" font-size="15" fill="#72798d" font-weight="400">JSON protocol over stdio</text>
<text x="430" y="427" font-size="15" fill="#72798d" font-weight="400">Docker lifecycle + runtime events</text>
