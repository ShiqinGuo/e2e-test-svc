<text x="612" y="518" font-size="12" fill="#6569a5" font-weight="400">run</text>
<path d="M410 620 H372 V400 H340" fill="none" stroke="#777cb3" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
<text x="376" y="548" font-size="12" fill="#6569a5" font-weight="400">files</text>
<rect x="780" y="496" width="300" height="190" rx="15" fill="#dddfea"/>
<rect x="780" y="490" width="300" height="190" rx="15" fill="#ffffff" stroke="#d7daea"/>
<text x="800" y="524" font-size="20" fill="#30364c" font-weight="700">Target websites + APIs</text>
<text x="800" y="554" font-size="15" fill="#72798d" font-weight="400">Existing application under test</text>
<text x="800" y="577" font-size="15" fill="#72798d" font-weight="400">Configured reachable origins</text>
<text x="800" y="600" font-size="15" fill="#72798d" font-weight="400">UI + API setup / cleanup</text>
<text x="800" y="623" font-size="15" fill="#72798d" font-weight="400">Not deployed by Flowtest</text>
<path d="M710 620 H780" fill="none" stroke="#777cb3" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M190 680 V717 H930 V680" fill="none" stroke="#777cb3" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
