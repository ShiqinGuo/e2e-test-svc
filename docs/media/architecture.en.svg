<text x="430" y="624" font-size="15" fill="#72798d" font-weight="400">Playwright Test + reporter</text>
<text x="430" y="647" font-size="15" fill="#72798d" font-weight="400">Isolated per-run execution</text>
<path d="M450 460 V503 H190 V560" fill="none" stroke="#777cb3" stroke-width="2" marker-end="url(#arrow)"/>
